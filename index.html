<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幾隻貓×金園排骨 補貨團</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#FFF8F0;color:#2d2017;line-height:1.5}
.banner{background:linear-gradient(135deg,#3c91ad 0%,#2a6e87 100%);color:#fff;text-align:center;padding:28px 16px 18px;position:relative;overflow:hidden}
.banner::after{content:'';position:absolute;bottom:-20px;left:0;right:0;height:40px;background:#FFF8F0;border-radius:50% 50% 0 0}
.banner h1{font-size:1.5em;margin-bottom:4px;text-shadow:1px 1px 3px rgba(0,0,0,.2)}
.banner p{font-size:.88em;opacity:.9}
.countdown-bar{background:#eb1d4e;color:#fff;text-align:center;padding:10px;font-weight:700;font-size:.95em;position:sticky;top:0;z-index:100}
.section-title{background:#3c91ad;color:#fff;text-align:center;padding:10px 16px;margin:20px 0 12px;font-size:1.1em;font-weight:700;border-radius:8px;margin-left:12px;margin-right:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px}
@media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr);max-width:900px;margin:0 auto;padding:0 20px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr);max-width:1100px}}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;transition:transform .15s}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#f0ebe5}
.card-body{padding:10px;flex:1;display:flex;flex-direction:column}
.card-body h3{font-size:.82em;font-weight:600;color:#2d2017;min-height:2.4em;line-height:1.3}
.card-body .spec{font-size:.72em;color:#888;margin-top:2px}
.price-row{display:flex;align-items:baseline;gap:4px;margin-top:auto;padding-top:6px}
.price{font-size:1.1em;font-weight:700;color:#eb1d4e}
.qty-ctrl{display:flex;align-items:center;justify-content:center;gap:0;margin-top:8px}
.qty-ctrl button{width:32px;height:32px;border:none;border-radius:50%;font-size:1.2em;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.qty-ctrl .minus{background:#f0ebe5;color:#2d2017}
.qty-ctrl .plus{background:#3c91ad;color:#fff}
.qty-ctrl .minus:active{background:#ddd}
.qty-ctrl .plus:active{background:#2a6e87}
.qty-ctrl span{width:36px;text-align:center;font-size:1.05em;font-weight:600}
.float-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.12);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:200;transform:translateY(100%);transition:transform .25s}
.float-bar.show{transform:translateY(0)}
.float-bar .info{font-size:.9em;color:#555}
.float-bar .info strong{color:#eb1d4e;font-size:1.15em}
.float-bar .btn-order{background:linear-gradient(135deg,#3c91ad,#2a6e87);color:#fff;border:none;border-radius:24px;padding:10px 28px;font-size:1em;font-weight:700;cursor:pointer}
.float-bar .btn-order:active{opacity:.85}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;justify-content:center;align-items:flex-end}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{text-align:center;margin-bottom:16px;color:#2d2017;font-size:1.2em}
.modal .order-summary{background:#f9f5f0;border-radius:10px;padding:14px;margin-bottom:16px;font-size:.88em}
.modal .order-summary li{list-style:none;display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #e0d8cf}
.modal .order-summary li:last-child{border:none}
.modal .order-summary .total-row{font-weight:700;font-size:1.05em;color:#eb1d4e;padding-top:8px;margin-top:4px;border-top:2px solid #3c91ad}
.modal label{display:block;font-weight:600;margin:12px 0 4px;font-size:.9em}
.modal input,.modal textarea{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:.95em;font-family:inherit}
.modal input:focus,.modal textarea:focus{outline:none;border-color:#3c91ad}
.modal textarea{resize:vertical;min-height:60px}
.modal .btn-submit{width:100%;background:linear-gradient(135deg,#3c91ad,#2a6e87);color:#fff;border:none;border-radius:12px;padding:14px;font-size:1.1em;font-weight:700;cursor:pointer;margin-top:16px}
.modal .btn-submit:disabled{opacity:.5;cursor:not-allowed}
.modal .btn-close{position:absolute;right:16px;top:16px;background:none;border:none;font-size:1.5em;cursor:pointer;color:#999}
.result-box{background:#f0faf0;border:2px solid #3c91ad;border-radius:12px;padding:16px;margin:16px 0;font-size:.88em;white-space:pre-line;line-height:1.6}
.btn-copy{background:#3c91ad;color:#fff;border:none;border-radius:8px;padding:8px 20px;font-size:.9em;cursor:pointer;margin-top:8px}
.ended-msg{text-align:center;padding:40px 20px;font-size:1.1em;color:#eb1d4e;font-weight:700}
.shipping-note{text-align:center;padding:10px 16px;font-size:.82em;color:#666;margin-top:4px}
.discount-note{background:#fff8e1;border:1.5px dashed #f0a830;border-radius:10px;margin:12px 12px 0;padding:12px 16px;text-align:center;font-size:.88em;color:#8a6d10;font-weight:600;line-height:1.5}
footer{text-align:center;padding:20px 16px 90px;font-size:.75em;color:#aaa}
</style>
</head>
<body>

<div class="banner">
  <h1>🍖 金園排骨 補貨團</h1>
  <p>傳承西門町一甲子美味｜幾隻貓×限定團購</p>
</div>

<div class="countdown-bar" id="countdown">⏰ 載入中...</div>
<div class="shipping-note">🚚 黑貓宅急便冷凍（台灣本島）免運｜結團後 5-7 工作天出貨</div>
<div class="discount-note">💡 單品可以只買 1 片！團主會統一湊滿組數，届時依套組優惠價結算，等於大家一起省 🎉</div>

<div id="app"></div>

<div class="float-bar" id="floatBar">
  <div class="info">已選 <span id="totalItems">0</span> 組　<strong>$<span id="totalPrice">0</span></strong></div>
  <button class="btn-order" onclick="openModal()">前往結單</button>
</div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

<footer>幾隻貓×金園排骨 補貨團 — Powered by Claude Code</footer>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxZiveEO8_255SmX4KC6SOjuj-K857yADVt1km2SkZ8BOQOcp1K6_nRX12XH2ecq_9Dvw/exec';
const DEADLINE = new Date('2026-10-21T18:00:00+08:00');

const PRODUCTS = {
  '🍖 單品散買（可只買 1 片，湊滿組數享折扣）': [
    { id:'s01', name:'厚切排骨（單片）', price:123, spec:'1片', img:'images/p07.avif' },
    { id:'s02', name:'金饌雞腿（單片）', price:139, spec:'1片', img:'images/p08.avif' },
    { id:'s03', name:'鹹酥雞腿肉（單包）', price:250, spec:'300g', img:'images/p13.avif' },
    { id:'s04', name:'挪威鯖魚片（單片）', price:160, spec:'L號 約170g', img:'images/p16.avif' },
  ],
  '🍇 綜合十果（新品）': [
    { id:'p01', name:'綜合十果 2小包', price:330, spec:'2入', img:'images/p01.avif' },
    { id:'p02', name:'綜合十果 1盒', price:1085, spec:'共7包', img:'images/p02.avif' },
  ],
  '🍗 超值套組': [
    { id:'p03', name:'鹹酥雞腿肉 8包', price:1998, spec:'', img:'images/p03.avif' },
    { id:'p04', name:'鹽酥雞腿肉6包+起司披薩2片', price:1948, spec:'', img:'images/p04.avif' },
    { id:'p05', name:'厚切排骨12片＋金饌雞腿12片', price:2990, spec:'', img:'images/p05.avif' },
    { id:'p06', name:'排骨12+雞腿12+鹽酥雞2+披薩2', price:3680, spec:'', img:'images/p06.avif' },
    { id:'p07', name:'厚切排骨 12片', price:1476, spec:'', img:'images/p07.avif' },
    { id:'p08', name:'金饌雞腿 12片', price:1668, spec:'', img:'images/p08.avif' },
    { id:'p09', name:'厚切排骨6片+金饌雞腿6片', price:1572, spec:'', img:'images/p09.avif' },
    { id:'p10', name:'排骨5+雞腿5+鯖魚3', price:1950, spec:'', img:'images/p10.avif' },
    { id:'p11', name:'排骨4+雞腿4+鹽酥雞2', price:1680, spec:'', img:'images/p11.avif' },
    { id:'p12', name:'排骨3+雞腿3+鹽酥雞1+披薩1', price:1340, spec:'', img:'images/p12.avif' },
  ],
  '🛒 加購品': [
    { id:'p14', name:'厚切里肌', price:263, spec:'500g', img:'images/p14.avif' },
    { id:'p15', name:'起司披薩1片+鹽酥雞1包', price:440, spec:'', img:'images/p15.avif' },
    { id:'p17', name:'特級麻辣養生鍋底', price:380, spec:'70g×5小包', img:'images/p17.avif' },
    { id:'p18', name:'泰式酸辣鍋底', price:380, spec:'70g×5小包', img:'images/p18.avif' },
    { id:'p19', name:'義式蕃茄鍋底', price:380, spec:'70g×5小包', img:'images/p19.avif' },
    { id:'p20', name:'養生麻油酒香鍋底', price:380, spec:'70g×5小包', img:'images/p20.avif' },
  ]
};

const qty = {};
const allProducts = [];
Object.values(PRODUCTS).forEach(arr => arr.forEach(p => { qty[p.id] = 0; allProducts.push(p); }));

function isEnded() { return Date.now() > DEADLINE.getTime(); }

function updateCountdown() {
  const el = document.getElementById('countdown');
  if (isEnded()) { el.textContent = '🔒 本團已截止，感謝支持！'; return; }
  const diff = DEADLINE.getTime() - Date.now();
  const d = Math.floor(diff/86400000), h = Math.floor(diff%86400000/3600000),
        m = Math.floor(diff%3600000/60000), s = Math.floor(diff%60000/1000);
  el.textContent = `⏰ 距離截止還有 ${d>0?d+'天 ':''}${h}時${m}分${s}秒`;
}

function render() {
  if (isEnded()) {
    document.getElementById('app').innerHTML = '<div class="ended-msg">🔒 本團已截止，感謝大家的支持！</div>';
    return;
  }
  let html = '';
  for (const [cat, items] of Object.entries(PRODUCTS)) {
    html += `<div class="section-title">${cat}</div><div class="grid">`;
    for (const p of items) {
      html += `
      <div class="card">
        <img src="${p.img}" alt="${p.name}" loading="lazy">
        <div class="card-body">
          <h3>${p.name}</h3>
          ${p.spec ? `<div class="spec">${p.spec}</div>` : ''}
          <div class="price-row"><span class="price">$${p.price.toLocaleString()}</span></div>
          <div class="qty-ctrl">
            <button class="minus" onclick="changeQty('${p.id}',-1)">−</button>
            <span id="qty-${p.id}">${qty[p.id]}</span>
            <button class="plus" onclick="changeQty('${p.id}',1)">＋</button>
          </div>
        </div>
      </div>`;
    }
    html += '</div>';
  }
  document.getElementById('app').innerHTML = html;
}

function changeQty(id, delta) {
  qty[id] = Math.max(0, qty[id] + delta);
  const el = document.getElementById('qty-' + id);
  if (el) el.textContent = qty[id];
  updateFloat();
}

function totalItems() { return Object.values(qty).reduce((a, b) => a + b, 0); }
function totalPrice() { return allProducts.reduce((s, p) => s + p.price * qty[p.id], 0); }

function updateFloat() {
  const bar = document.getElementById('floatBar');
  const items = totalItems();
  document.getElementById('totalItems').textContent = items;
  document.getElementById('totalPrice').textContent = totalPrice().toLocaleString();
  bar.classList.toggle('show', items > 0);
}

function openModal() {
  const selected = allProducts.filter(p => qty[p.id] > 0);
  if (!selected.length) return;
  const total = totalPrice();
  let sumHtml = selected.map(p =>
    `<li><span>${p.name} × ${qty[p.id]}</span><span>$${(p.price * qty[p.id]).toLocaleString()}</span></li>`
  ).join('');
  sumHtml += `<li class="total-row"><span>總金額</span><span>$${total.toLocaleString()}</span></li>`;

  document.getElementById('modal').innerHTML = `
    <h2>📋 確認訂單</h2>
    <ul class="order-summary">${sumHtml}</ul>
    <label>姓名 *</label>
    <input id="nameInput" placeholder="請輸入姓名" autofocus>
    <label>備註（選填）</label>
    <textarea id="noteInput" placeholder="例如：想跟某某合併寄送"></textarea>
    <button class="btn-submit" id="btnSubmit" onclick="submitOrder()">送出訂單</button>
  `;
  document.getElementById('overlay').classList.add('show');
}

function closeModal(e) {
  if (e.target === document.getElementById('overlay')) {
    document.getElementById('overlay').classList.remove('show');
  }
}

async function submitOrder() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { alert('請輸入姓名'); return; }
  const note = document.getElementById('noteInput').value.trim();
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = '送出中...';

  const selected = allProducts.filter(p => qty[p.id] > 0);
  const summary = selected.map(p => `${p.name}×${qty[p.id]}`).join('、');
  const total = totalPrice();

  const params = new URLSearchParams({ name, summary, total: String(total), note });
  allProducts.forEach(p => { if (qty[p.id] > 0) params.append(p.id, String(qty[p.id])); });

  try {
    await fetch(GAS_URL, { method: 'POST', body: params, mode: 'no-cors' });
    showResult(name, selected, total, note);
  } catch (e) {
    alert('送出失敗，請稍後再試');
    btn.disabled = false; btn.textContent = '送出訂單';
  }
}

function showResult(name, selected, total, note) {
  let detail = selected.map(p =>
    `• ${p.name} × ${qty[p.id]}　$${(p.price * qty[p.id]).toLocaleString()}`
  ).join('\n');
  const text = `${name}你好！\n訂購明細：\n${detail}\n總金額：$${total.toLocaleString()}${note ? '\n備註：' + note : ''}`;

  document.getElementById('modal').innerHTML = `
    <h2>✅ 訂單已送出！</h2>
    <div class="result-box" id="resultText">${text}</div>
    <button class="btn-copy" onclick="copyResult()">📋 複製訂單內容</button>
    <p style="text-align:center;margin-top:12px;font-size:.82em;color:#888">感謝訂購！如需修改請重新下單或聯繫團主</p>
  `;
  // reset
  allProducts.forEach(p => qty[p.id] = 0);
  updateFloat();
}

function copyResult() {
  const text = document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    btn.textContent = '✅ 已複製！';
    setTimeout(() => btn.textContent = '📋 複製訂單內容', 2000);
  });
}

// Init
render();
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
